name: Publish Multilingual Academic Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-site.txt
            requirements-browser.txt
      - name: Install pinned build and browser dependencies
        run: |
          set -euo pipefail
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check -r requirements-site.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Build academic release and bilingual editions
        run: |
          python scripts/release_editorial.py
          python scripts/build_bilingual.py
          python scripts/build_team_directory.py
          python scripts/enhance_visuals.py
          python scripts/apply_v48.py
          python scripts/apply_design_system.py
          python scripts/apply_audit_fixes.py
          python scripts/apply_record_review.py
      - name: Validate public status, privacy, search and documents
        run: |
          python scripts/verify_bilingual.py
          python scripts/verify_audit.py
          python scripts/verify_profile_refinement.py
      - name: Test mobile, desktop and interactive controls in Chromium
        run: |
          python tests/bilingual_browser.py
          python tests/design_browser.py
          python tests/audit_browser.py
          python tests/network_browser.py
          python tests/record_review_browser.py
      - name: Render complete project rosters and profile memberships
        run: python scripts/complete_project_rosters.py
      - name: Add and validate opt-in academic AI conversation
        run: |
          python scripts/build_assistant.py
          python tests/assistant_browser.py
      - name: Build and test question-specific public-record answers
        run: |
          python scripts/build_assistant_quality.py
          node --check _site/assets/academic-assistant.js
          node --check _site/assets/academic-answer-engine.js
          python tests/assistant_quality_browser.py
      - name: Build and test server-ready conversation
        run: |
          set -euo pipefail
          python scripts/build_assistant_v3.py
          node --check _site/assets/assistant-conversation.js
          node --test assistant-service/test/*.test.mjs | tee assistant-service-test.tap
          python tests/assistant_v3_browser.py
      - name: Validate final rosters, assistant data and responsive member cards
        run: python tests/project_rosters_browser.py
      - name: Build and validate German edition
        run: |
          set -euo pipefail
          python scripts/build_german.py
          node --check _site/assets/german-controls.js
          node --check _site/assets/german-directory.js
          node --check _site/assets/german-guide.js
          node --check _site/assets/german-conversation.js
          python tests/german_browser.py
      - name: Add source-verified 1002 team in all three languages
        run: |
          python scripts/add_1002_team.py
          python tests/project_1002_browser.py
      - name: Apply and verify current publications, conferences, COST and 2221 applications
        run: |
          python scripts/apply_academic_updates.py
          node --check _site/assets/academic-answer-engine.js
          node --check _site/assets/german-guide.js
          python tests/academic_updates.py --browser
      - name: Retain browser and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-quality
          path: |
            browser-report.json
            design-browser-report.json
            audit-browser-report.json
            audit-report.json
            profile-refinement-report.json
            network-browser-report.json
            record-review-report.json
            record-review-browser-report.json
            assistant-browser-report.json
            assistant-quality-build.json
            assistant-quality-report.json
            assistant-v3-browser-report.json
            assistant-service-test.tap
            project-roster-report.json
            project-roster-browser-report.json
            project-roster-previews/
            assistant-v3-previews/
            assistant-quality-previews/
            assistant-previews/
            profile-previews/
            design-previews/
            german-build-report.json
            german-test-report.json
            german-previews/
            project-1002-build-report.json
            project-1002-test-report.json
            project-1002-previews/
            academic-updates-build.json
            academic-updates-test-report.json
            academic-updates-previews/
            _site/quality-report.json
            overflow-smoke.png
          if-no-files-found: warn
          retention-days: 30
      - name: Validate internal links and create release checksums
        run: python scripts/verify_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirm current Pages artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          expected_id = int(os.environ['PAGES_ARTIFACT_ID'])
          expected_name = os.environ['PAGES_ARTIFACT_NAME']
          endpoint = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100")
          for attempt in range(12):
              request = Request(endpoint, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urlopen(request, timeout=15) as response:
                      artifacts = json.load(response)['artifacts']
                  matches = [a for a in artifacts if a['name'] == expected_name and not a['expired']]
                  if len(matches) == 1 and matches[0]['id'] == expected_id:
                      print(f'Confirmed current Pages artifact: {expected_id}')
                      break
              except URLError:
                  pass
              if attempt == 11:
                  raise SystemExit('The exact uploaded Pages artifact is not available; deployment stopped.')
              time.sleep(5)
          PY
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify every live file against the release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_site.py --live
      - name: Record release
        run: |
          echo '## Academic website — current research and academic service in EN/TR/DE' >> "$GITHUB_STEP_SUMMARY"
          echo 'Includes the publisher-verified Computers & Education paper, accepted BİLTEK 16 oral presentation, CA25177 ENDUeAI WG1/WG6 membership and four submitted TÜBİTAK 2221 applications (2026/4; decisions pending). Search, assistant records, citation exports and public EN/TR CVs are synchronized.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Private application documents are excluded. The 1002 roster and existing funding boundaries remain intact. No cloud conversation service has been activated.' >> "$GITHUB_STEP_SUMMARY"
