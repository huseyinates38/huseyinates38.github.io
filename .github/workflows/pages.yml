name: Publish Bilingual Academic Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-site.txt
            requirements-browser.txt
      - name: Install pinned build and browser dependencies
        run: |
          set -euo pipefail
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check -r requirements-site.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Build academic release and bilingual editions
        run: |
          python scripts/release_editorial.py
          python scripts/build_bilingual.py
          python scripts/build_team_directory.py
          python scripts/enhance_visuals.py
          python scripts/apply_v48.py
          python scripts/apply_design_system.py
          python scripts/apply_audit_fixes.py
      - name: Validate public status, privacy, search and documents
        run: |
          python scripts/verify_bilingual.py
          python scripts/verify_audit.py
          python scripts/verify_profile_refinement.py
      - name: Test mobile, desktop and interactive controls in Chromium
        run: |
          python tests/bilingual_browser.py
          python tests/design_browser.py
          python tests/audit_browser.py
          python tests/network_browser.py
      - name: Retain browser and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-quality
          path: |
            browser-report.json
            design-browser-report.json
            audit-browser-report.json
            audit-report.json
            profile-refinement-report.json
            network-browser-report.json
            profile-previews/
            design-previews/
            _site/quality-report.json
            overflow-smoke.png
          if-no-files-found: warn
          retention-days: 30
      - name: Validate internal links and create release checksums
        run: python scripts/verify_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every live file against the release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_site.py --live
      - name: Record release
        run: |
          echo '## Academic website 5.2 — precise profile fields, bilingual copy and network search' >> "$GITHUB_STEP_SUMMARY"
          echo 'Shared visual system on all pages, independent EN/TR hero images, five photo-backed highlights, preserved research records and responsive controls.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Browser and live-file tests passed. These tests are not WCAG certification or academic fact verification.' >> "$GITHUB_STEP_SUMMARY"
